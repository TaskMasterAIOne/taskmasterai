    <!-- Prevent flash of wrong theme - MUST run before any rendering -->
    <script>
      (function() {
        // Check theme-mode first (React ThemeContext), then legacy 'theme' key
        const savedMode = localStorage.getItem('theme-mode');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        
        // Determine the actual theme to apply
        let isDark = false;
        if (savedMode === 'dark') {
          isDark = true;
        } else if (savedMode === 'light') {
          isDark = false;
        } else {
          // 'system' mode or no preference - use system preference
          isDark = prefersDark;
        }
        
        // Apply theme class immediately
        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        
        // Update theme-color meta tag based on theme
        const themeColor = isDark ? '#171717' : '#FFFFFF';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', themeColor);
      })();
    </script>
    <!-- Critical CSS to prevent flash - inline background colors before stylesheet loads -->
